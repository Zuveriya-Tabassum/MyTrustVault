# Render Blueprint: New > Blueprint > pick this repo. Creates the web service and a Postgres database.
databases:
  - name: trustvault-db
    plan: free
services:
  - type: web
    name: trustvault
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: SEED_PASSWORD        # you choose it in the dashboard; put the same value in the README credentials
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: STORAGE_DIR
        value: /tmp/storage       # ephemeral on the free plan: demo files are re-created at every boot by the seed
